[project]
name = "incident-room"
version = "1.0.0"
description = "Collaborative, evidence-checked data incident investigation inspired by Blackbox"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3", "sqlalchemy>=2,<3", "psycopg[binary]>=3.2,<4", "httpx>=0.27,<1", "websockets>=14,<17", "openai>=2,<3", "google-cloud-bigquery>=3.30,<4", "google-auth[requests]>=2.40,<3", "sqlglot>=27,<31", "python-dotenv>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/incident_room"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
